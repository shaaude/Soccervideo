# Smoke-test configuration used to verify the pipeline in a CPU-only environment without the
# Roboflow checkpoints. NOT a production configuration.
device: cpu
require_production_manifest: false
detection:
  class_map: config/classmaps/soccernet_yolov8_smoke.yaml
  player_weights: models/smoke/soccernet-yolov8-best.pt
  ball_weights: null
  imgsz: 1280
  person_conf: 0.25
  ball_conf_keep: 0.05
  max_frames: null
  annotated_video: true
  tracker: {track_activation_threshold: 0.25, lost_track_buffer: 30, minimum_matching_threshold: 0.8}
identity: {team_clustering: true, samples_per_track: 8, review_crops_per_track: 5}
calibration: {max_median_error_m: 2.0, accept_unvalidated: false}
candidates: {ball_threshold: 0.15, player_threshold: 0.25, max_distance: 0.45, margin: 0.08,
             support_window: 7, support_min: 3, segment_gap_s: 0.35, min_transfer_gap_s: 0.12, max_transfer_gap_s: 4.0}
highlights: {before: 4.0, after: 6.0}
temporal_model: {enabled: false}
