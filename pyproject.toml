[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-vision"
version = "0.1.0"
description = "Evidence-linked soccer video analytics: detection, tracking, candidate events, human review, verified profiles."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Video inference stage (Step 6). Ultralytics is AGPL-3.0: review licensing before distributing.
# supervision is capped below 0.31: sv.ByteTrack is deprecated since 0.28 and removed in 0.31.
vision = ["ultralytics>=8.3", "supervision>=0.25,<0.31", "torch>=2.3"]
db = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
review = ["streamlit>=1.40"]
eval = ["motmetrics>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
soccer-vision = "soccer_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soccer_vision = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires a reachable PostgreSQL (SOCCER_TEST_DATABASE_URL)",
  "video: requires ffmpeg",
  "model: requires model weights (SOCCER_TEST_WEIGHTS)",
]
